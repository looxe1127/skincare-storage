        // ============================================================
        // 🏷️ 移動函數（Fix 箭嘴）
        // ============================================================

        function moveCategory(cat, direction) {
            const catKeys = Object.keys(categories);
            const sorted = sortCategories(catKeys);
            const idx = sorted.indexOf(cat);
            if (idx === -1) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= sorted.length) return;
            const other = sorted[newIdx];
            // 交換 order
            const catOrder = categories[cat] ? categories[cat].order : 999;
            const otherOrder = categories[other] ? categories[other].order : 999;
            if (categories[cat]) categories[cat].order = otherOrder;
            if (categories[other]) categories[other].order = catOrder;
            saveToStorage();
            renderTagManager('categories');
            renderFilterBar();
            renderLocationFilterBar();
            renderAll();
            showToast('↕️ 已調整次序');
        }

        function moveSub(cat, sub, direction) {
            if (!categories[cat] || !categories[cat].subOrder) return;
            const idx = categories[cat].subOrder.indexOf(sub);
            if (idx === -1) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= categories[cat].subOrder.length) return;
            [categories[cat].subOrder[idx], categories[cat].subOrder[newIdx]] = [categories[cat]
                .subOrder[newIdx], categories[cat].subOrder[idx]
            ];
            saveToStorage();
            renderTagManager('subcategories');
            populateSelects();
            showToast('↕️ 已調整次序');
        }

        function moveBrand(b, direction) {
            const idx = brands.indexOf(b);
            if (idx === -1) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= brands.length) return;
            [brands[idx], brands[newIdx]] = [brands[newIdx], brands[idx]];
            saveToStorage();
            renderTagManager('brands');
            updateBrandSelects();
            showToast('↕️ 已調整次序');
        }

        function moveLocation(loc, direction) {
            const idx = locations.indexOf(loc);
            if (idx === -1) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= locations.length) return;
            [locations[idx], locations[newIdx]] = [locations[newIdx], locations[idx]];
            saveToStorage();
            renderTagManager('locations');
            renderLocationFilterBar();
            populateSelects();
            showToast('↕️ 已調整次序');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!$('detailModal').classList.contains('hidden')) closeDetail();
                if (!$('stockModal').classList.contains('hidden')) $('stockModal').classList.add('hidden');
                if (!$('shoppingItemModal').classList.contains('hidden')) $('shoppingItemModal').classList
                    .add('hidden');
                if (!$('quickAddModal').classList.contains('hidden')) $('quickAddModal').classList.add(
                'hidden');
                if (!$('typePickerModal').classList.contains('hidden')) $('typePickerModal').classList.add(
                    'hidden');
                if (!$('boughtModal').classList.contains('hidden')) $('boughtModal').classList.add('hidden');
                if (!$('tagManagerModal').classList.contains('hidden')) $('tagManagerModal').classList.add(
                    'hidden');
            }
        });

        // ============================================================
        // 🚀 啟動
        // ============================================================

        if (!checkLoginStatus()) {
            showLogin();
        }

        console.log('🧴 護膚品庫存 App 已啟動 (Firebase 版本 - Fix 分類)！');
        console.log('📌 家庭代碼會作為 Firebase 路徑，不同代碼資料分開');
        console.log('📌 分類標籤管理：撳「🏷️ 分類標籤」可管理類別/子類別/品牌/位置');
        console.log('📌 已自動修復「爽膚水」等分類');
    </script>
